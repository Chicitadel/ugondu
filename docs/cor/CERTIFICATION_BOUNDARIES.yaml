  - id: "aws.bootstrap.slr-prerequisite"
    status: "MODIFICATION_ZONE"
    classification: "DEFECT_REMEDIATION_ZONE"
    owner: "Platform Operations & Authorization Governance"
    finding:
      - "COR-001" # Service-linked role failure is not fail-closed early enough
      - "COR-007" # Service-linked-role policy scope and authorization path need provider validation
    targetPaths:
      - "scripts/aws-conformance/reconcile-bootstrap-policy-pack.mjs"
      - "policy-packs/aws/cor/bootstrap/runner-bootstrap-permissions.json"
    mutationPolicy: "ALLOW_REVISED_IMPLEMENTATION"
    remediationScope:
      - "Query for SLR existence using supported read API before attempting creation"
      - "Differentiate EntityAlreadyExists (re-read & verify) from AccessDenied or ServiceControlPolicy denial"
      - "Emit typed blocker (UG-BOOTSTRAP-AUTH-MISSING) and halt immediately without swallowing exceptions"
      - "Scope iam:CreateServiceLinkedRole with iam:AWSServiceName condition"
    dependencies:
      - "aws.oidc-tagged-role-chain"
    gatingTests:
      - "test/aws-conformance/slr-reconciliation.test.ts"
      - "test/aws-conformance/slr-denial-blocker.test.ts"
      - "test/aws-conformance/slr-permission-boundary.test.ts"

  - id: "aws.bootstrap.policy-reconciliation"
    status: "MODIFICATION_ZONE"
    classification: "DEFECT_REMEDIATION_ZONE"
    owner: "Security & Policy Governance Authority"
    finding:
      - "COR-002" # Bootstrap can misreport a denied mutation as a successful bootstrap phase
      - "COR-003" # Policy provisioning logic is not a complete ownership-safe reconciler
    targetPaths:
      - "scripts/aws-conformance/reconcile-bootstrap-policy-pack.mjs"
      - "server/capabilities/src/continuity/BootstrapPolicyOrchestrator.ts"
      - "policy-packs/aws/cor/pack.yaml"
    mutationPolicy: "ALLOW_REVISED_IMPLEMENTATION"
    remediationScope:
      - "Enforce fail-closed exit semantics: non-zero exit on denial, never report success when unverified"
      - "Structure reconciler into explicit phases: discovery -> desired plan -> auth preflight -> mutation -> post-verification"
      - "Strict create-before-attach ordering with individual post-read validation"
      - "Verify ownership metadata and canonical tags; unknown objects remain untouched"
      - "Idempotent NO_OP when policy pack is already converged"
    dependencies:
      - "aws.bootstrap.slr-prerequisite"
    gatingTests:
      - "test/aws-conformance/reconcile-fail-closed.test.ts"
      - "test/aws-conformance/policy-lifecycle-ordering.test.ts"
      - "test/aws-conformance/ownership-safe-adoption.test.ts"

  - id: "core.policy-renderer-and-digest"
    status: "MODIFICATION_ZONE"
    classification: "DEFECT_REMEDIATION_ZONE"
    owner: "Core Architecture & Cryptographic Governance Authority"
    finding:
      - "COR-004" # Region/account/name values are pinned rather than rendered from validated target configuration
      - "COR-005" # Wildcard-resource validation blocks legitimate provider policies
      - "COR-006" # Policy digest canonicalization is not recursively canonical
    targetPaths:
      - "server/capabilities/src/continuity/RegionPolicyRenderer.ts"
      - "server/capabilities/src/continuity/CanonicalPolicyRegistry.ts"
      - "policy-packs/aws/cor/pack.yaml"
    mutationPolicy: "ALLOW_REVISED_IMPLEMENTATION"
    remediationScope:
      - "Render target accounts, partitions, and regions from validated input without fallback pins"
      - "Action-aware wildcard validation: allow '*' for read/list/describe actions per provider catalog, block for mutative actions"
      - "Recursive canonical JSON digest implementation ensuring nested keys are sorted deterministically"
      - "Strict validation rejecting non-finite numbers and non-JSON values"
    dependencies: []
    gatingTests:
      - "test/continuity/canonical-json-digest.test.ts"
      - "test/continuity/region-policy-renderer.test.ts"
      - "test/continuity/action-aware-wildcard.test.ts"
      - "test/continuity/multi-account-region-rendering.test.ts"

  - id: "platform.provider-neutral-adapters"
    status: "IN_PROGRESS"
    classification: "ARCHITECTURE_EVOLUTION_ZONE"
    owner: "Platform Architecture & Multi-Cloud Engineering Authority"
    finding:
      - "COR-008" # Orchestrator is not yet proof of universal provider support
      - "COR-013" # cPanel / DirectAdmin / shared hosting / private host adapters not yet qualified
    targetPaths:
      - "server/capabilities/src/continuity/BootstrapPolicyOrchestrator.ts"
      - "server/capabilities/src/continuity/ResumePlanner.ts"
      - "server/capabilities/src/continuity/DuplicateRoleGuard.ts"
      - "server/capabilities/src/continuity/ExecutionContinuityLedger.ts"
    mutationPolicy: "ALLOW_REVISED_IMPLEMENTATION"
    remediationScope:
      - "Decouple orchestrator from AWS-specific primitives into universal PolicyPermissionAdapter interface"
      - "Formal capability negotiation (SUPPORTED, UNSUPPORTED, CONDITIONAL, UNKNOWN)"
      - "Preserve OS/entrypoint parity (CLI, UI, IDE, CI/headless) over shared execution ledger"
      - "Durable crash-safe resume ledger with transaction lock and idempotency keys"
    dependencies:
      - "core.policy-renderer-and-digest"
      - "aws.bootstrap.policy-reconciliation"
    gatingTests:
      - "test/continuity/provider-adapter-contract.test.ts"
      - "test/continuity/cross-os-entrypoint-parity.test.ts"
      - "test/continuity/durable-resume-crash-recovery.test.ts"

  - id: "core.universal-region-selection"
    status: "MODIFICATION_ZONE"
    classification: "ARCHITECTURE_EVOLUTION_ZONE"
    owner: "Platform Architecture & Multi-Region Governance Authority"
    finding:
      - "COR-004" # Region/account/name values must be resolved dynamically without hidden defaults
      - "URS-ADDENDUM" # Universal Region Selection and Multi-Region Governance
    targetPaths:
      - "server/capabilities/src/continuity/UniversalPlacementResolver.ts"
      - "server/capabilities/src/continuity/RegionPolicyRenderer.ts"
      - "scripts/aws-conformance/target-resolver.mjs"
      - "server/capabilities/src/agent-neutral/GraphicalControlContracts.ts"
    mutationPolicy: "ALLOW_REVISED_IMPLEMENTATION"
    remediationScope:
      - "Prohibit silent hardcoded deployment region defaults across all entrypoints"
      - "Resolve beginner-friendly city/country/geography inputs and disambiguate multi-region matches"
      - "Enforce 7-level placement priority order (residency -> explicit -> approved config -> audience geography -> service/latency -> permissioned IP hint -> REGION_SELECTION_REQUIRED)"
      - "Support multi-region topologies and failover validation without unapproved region spillover"
    dependencies:
      - "core.policy-renderer-and-digest"
    gatingTests:
      - "server/capabilities/src/tests/universal-placement-resolver.spec.ts"
      - "tests/qualification/universal-region-selection.test.js"

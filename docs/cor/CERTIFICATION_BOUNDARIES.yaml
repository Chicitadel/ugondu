    classification: "CRITICAL_PROTECTED"
    owner: "Security & IAM Architecture Authority"
    protectedPaths:
      - ".github/workflows/cor.yml"
      - "policy-packs/aws/cor/templates/roles/execution-role-trust.json"
    mutationPolicy: "REQUIRE_EXPLICIT_MODIFICATION_ZONE"
    evidence:
      workflowRun: "39632147169"
      jobs:
        - "119332941489" # Base OIDC Credential Configuration
        - "119332941751" # Assume Tagged Execution Session
      verifiedIdentity: "UgonduCORRunner -> UgonduCORExecutionRole"
      artifactDigest: "sha256:d8c52e46b0a9914eb1d81b22e17ce42fb9023f03b876f2d5e5e347719602a831"
    dependencies:
      - "aws.bootstrap.policy-reconciliation"
    invalidationTriggers:

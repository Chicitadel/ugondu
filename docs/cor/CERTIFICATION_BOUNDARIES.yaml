schemaVersion: "ugondu.io/cor-boundary/v1"
registryType: "CertificationBoundaryRegistry"

governanceRules:
  protectedZoneRule: |
    A certified boundary is immutable by default. Any pull request or commit modifying
    paths declared under protectedPaths MUST explicitly declare a matching approved
    MODIFICATION_ZONE in this registry. Mutating protected paths without an approved
    modification zone declaration fails CI governance gates immediately.
  mutationPolicies:
    REQUIRE_EXPLICIT_MODIFICATION_ZONE:
      description: "Path is strictly immutable under normal engineering. Requires registered active modification zone with approved remediation scope."
    ALLOW_REVISED_IMPLEMENTATION:
      description: "Active defect remediation or feature boundary currently under engineering implementation."
    DENY_MUTATION:
      description: "Absolute freeze. No mutation permitted regardless of modification zone."
  statusDefinitions:
    CERTIFIED: "Fully verified passing evidence bound to specific workflow runs, commits, and digests."
    MODIFICATION_ZONE: "Active remediation zone addressing identified audit findings."
    IN_PROGRESS: "Architectural evolution or adapter implementation actively under development."
    UNCERTIFIED: "Unverified boundary; no empirical qualification established."

summary:
  totalBoundaries: 8
  certifiedCount: 3
  modificationZoneCount: 4
  inProgressCount: 1
  uncertifiedCount: 0

boundaries:
  - id: "aws.oidc-tagged-role-chain"

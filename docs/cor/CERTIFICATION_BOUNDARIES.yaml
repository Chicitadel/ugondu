    mutationPolicy: "REQUIRE_EXPLICIT_MODIFICATION_ZONE"
    evidence:
      workflowRun: "39632147169"
      verifiedActions:
        - "ec2:CreateVpc"
        - "ec2:CreateSubnet"
        - "ec2:CreateSecurityGroup"

# Project        : EAORCS - Enterprise Autonomous Operation & Regulatory Compliance System
# File           : .governance/localization-policy.yaml
# Version        : 2026.3.1-LTS
# Author         : Systems Engineering & Security Governance Authority
# Organization   : Ujomor Systems & Enterprise Governance Authority
# Created Date   : 2026-08-17
# Last Modified  : 2026-08-17
# Classification : ENTERPRISE | RESTRICTED
#
# Governance:
# - Security Reviewed
# - Architecture Controlled
# - Protocol Frozen
# - Modularization Enforced
#
# Standards:
# - ISO 27001
# - SOC 2
# - OWASP ASVS
# - NIST SP 800-161
# - CMS-STD-009 (Internationalisation Standard)
# - UAIGOS 3.0.0
#
# Constitutional Rule:
# EAORCS SHALL be linguistically neutral at kernel level. No human language,
# including English, shall be treated as an implicit universal base, mandatory
# locale, or mandatory fallback. Locale availability, activation, reference
# language, fallback behavior, and actor preference shall be governed explicitly
# by project, package, environment, and actor policy.
# ==============================================================================

version: "1.0"

# Governance mode: OFF | WARN | ENFORCE | AUTO
# PUBLIC_RELEASE always forces ENFORCE regardless of this setting
mode: ENFORCE

localePolicy:
  # LANGUAGE_NEUTRAL: no implicit English, no implicit fallback
  # Projects must declare exactly what locales they support.
  # English is NOT assumed. No locale is assumed.
  strategy: LANGUAGE_NEUTRAL

  # Discovery: scan locales/ directory for available (installed) locale files
  discovery: DIRECTORY

  # Enabled locales: MUST be explicitly declared by project.
  # Empty [] = project has not declared enabled locales yet (will fail public release validation).
  enabledLocales:
    - en
    - fr
    - de
    - es
    - ar

  # Locale count policy
  minimumLocales: 1
  maximumLocales: UNLIMITED

  # Fallback locale: null = no fallback configured.
  # A missing translation produces LOCALE_RESOLUTION_FAILURE, not silent English fallback.
  # Projects must explicitly configure fallback if they want one.
  # FORBIDDEN: defaulting to 'en' when fallback is not configured.
  fallback:
    enabled: false
    locale: null

  # Reference/authoring locale: the language used to author canonical token keys.
  # When disabled or null, canonical token set is the union across all enabled locales.
  referenceLocale:
    enabled: false
    locale: null

  # Completeness requirements
  requireAllEnabledLocalesComplete: true
  allowPartialLocales: false
  allowUnknownLocales: false

  # Public release gate requirements
  publicRelease:
    requireExplicitLocaleSelection: true
    requireFallbackDeclaration: false

# Named locale profiles — no geopolitical defaults are shipped.
# Projects define their own profiles.
localeProfiles:
  global:
    enabledLocales:
      - en
      - fr
      - de
      - es
      - ar
  european:
    enabledLocales:
      - fr
      - de
      - es
  mena:
    enabledLocales:
      - ar

hardcodedStrings:
  mode: ENFORCE

autoHealing:
  mode: AUTO

publicBoundary:
  mode: ENFORCE

product:
  id: ugondu
  code: UGONDU
  name: Ugondu Universal Deployment Intelligence Platform
  version: 4.0.0
  organization: Air Roofers SASU / Ujomor Engineering
  publisher: AIR ROOFERS
  classification: GOVERNMENT | ENTERPRISE
  baseline: UAIGOS-3.0.0 / SEOS Baseline 1.0
  docs_root: products/ugondu/docs/commercial

product_boundary:
  description: Universal Deployment Intelligence Platform, decentralized identity gateway, tamper-proof audit ledger, and high-throughput data federation bus.
  architecture_pattern: MODULAR_MICROSERVICES
  sub_engines:
    - doc-intel: AST parser, documentation generator, digital twin spec validator
    - gov-council: ADR compliance checker, schema contract verifier, finding generator
    - fix-lab: Sandbox code remediator, AST diff boundary verifier, automated test runner

health_contracts:
  liveness: /health/live
  readiness: /health/ready
  metadata: /v1/metadata
  legacy_health: /health
  metrics: /metrics

services:
  engine_core:
    service_id: engine_core
    name: engine-core
    port: 4001
    host: localhost
    docker_host: engine-core
    protocol: http
    base_path: /v1
    liveness: /health/live
    readiness: /health/ready
    metadata: /v1/metadata
  billing_gateway:
    service_id: billing_gateway
    name: billing-gateway
    port: 4002
    host: localhost
    docker_host: billing-gateway
    protocol: http
    base_path: /v1
    liveness: /health/live
    readiness: /health/ready
    metadata: /v1/metadata
  plugin_manager:
    service_id: plugin_manager
    name: plugin-manager
    port: 4003
    host: localhost
    docker_host: plugin-manager
    protocol: http
    base_path: /v1
    liveness: /health/live
    readiness: /health/ready
    metadata: /v1/metadata
  event_bus:
    service_id: event_bus
    name: event-bus
    port: 4004
    host: localhost
    docker_host: event-bus
    protocol: http
    base_path: /v1
    liveness: /health/live
    readiness: /health/ready
    metadata: /v1/metadata
  repository_adapter:
    service_id: repository_adapter
    name: repository-adapter
    port: 4005
    host: localhost
    docker_host: repository-adapter
    protocol: http
    base_path: /v1
    liveness: /health/live
    readiness: /health/ready
    metadata: /v1/metadata

editions:
  - community
  - professional
  - business
  - enterprise
  - sovereign

edition_definitions:
  community:
    rank: 1
    token_prefix: "(none)"
    strategy: quota-sync
    max_plugins: 1
    rollbacks: false
    atomic: false
    telemetry: false
  professional:
    rank: 2
    token_prefix: "ugp_"
    strategy: atomic
    max_plugins: 5
    rollbacks: true
    atomic: true
    telemetry: false
  business:
    rank: 3
    token_prefix: "ugb_"
    strategy: atomic
    max_plugins: 50
    rollbacks: true
    atomic: true
    telemetry: true
  enterprise:
    rank: 4
    token_prefix: "uge_"
    strategy: atomic
    max_plugins: 999
    rollbacks: true
    atomic: true
    telemetry: true
  sovereign:
    rank: 5
    token_prefix: "ugs_"
    strategy: atomic
    max_plugins: 999
    rollbacks: true
    atomic: true
    telemetry: true

capabilities:
  - SECURITY_KERNEL
  - BASIC_VERIFICATION
  - CORE_RECOVERY_SAFETY
  - COR_EXECUTION_INTEGRITY
  - BASIC_AUDIT_TRAIL
  - EMERGENCY_ROLLBACK
  - BASIC_DEPLOYMENT
  - AUTHENTICATION
  - ATOMIC_DEPLOYMENT
  - ROLLBACK
  - PLUGIN_SANDBOX
  - EVENT_FEDERATION
  - TELEMETRY_STREAMING
  - ENTERPRISE_GOVERNANCE
  - SOVEREIGN_ATTESTATION

cors:
  allowed_origins:
    - https://admin.airroofers.eu
    - https://governance.airroofers.eu
    - https://license.airroofers.eu
    - https://ugondu.airroofers.eu
    - http://localhost:3000
    - http://localhost:4001

federation_adapters:
  iam:
    contract: "@airroofers/iam-sdk"
    endpoint: "https://iam.airroofers.eu"
  aerobill:
    contract: "@airroofers/aerobill-sdk"
    endpoint: "https://billing.airroofers.eu"
  ai:
    contract: "@airroofers/ai-client"
    endpoint: "https://ai.airroofers.eu"

governance:
  framework: UAIGOS v3.0.0 / SEOS Baseline 1.0
  standards:
    - ISO 27001
    - SOC 2 Type II
    - OWASP ASVS v5.0
    - NIST SP 800-207
  architecture_freeze: true
  protocol_freeze: true
  security_reviewed: true
  bounded_contexts_enforced: true

certification:
  decision: CERTIFIED_LTS
  certification_engine: "certify.js"
  gate_status:
    foundational: PASSED
    engineering: PASSED
    operational: PASSED
    production: READY

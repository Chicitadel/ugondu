contract_id: INFRA-CDN-001
type: infrastructure_contract
name: CDN Configuration Contract
version: 1.0.0
status: active
description: Enforces CDN edge rules, caching, and hotlink protection.

requirements:
  headers:
    - HSTS: "max-age=31536000; includeSubDomains; preload"
    - X-Content-Type-Options: "nosniff"
    - X-Frame-Options: "SAMEORIGIN"
    - X-XSS-Protection: "1; mode=block"
    - Referrer-Policy: "strict-origin-when-cross-origin"
  caching:
    default_ttl: "1 month"
    css_js_ttl: "1 year"
    fonts_ttl: "1 year"
    images_ttl: "1 month to 1 year"
  security:
    hotlink_protection: true
    allowed_domains:
      - "*.airroofers.eu"
      - "*.ujomor.com"
    ddos_protection: true
    blocked_agents:
      - "libwww-perl"
      - "wget"
      - "python"
      - "nikto"
      - "scan"
      - "java"
      - "googlebot"

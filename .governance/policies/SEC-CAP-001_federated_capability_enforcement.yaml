policy_id: SEC-CAP-001
title: "Federated Capability & Server-Authoritative Architecture Enforcement Standard"
version: "2026.3.1-LTS"
status: "FROZEN_CONSTITUTIONAL"
classification: "ENTERPRISE_RESTRICTED"
effective_date: "2026-08-17"
review_cycle: "QUARTERLY"
precedence_tier: "GOVERNANCE_SECURITY_TIER_1"
governance_framework: "UAIGOS 3.0.0"

compliance_mappings:
  iso_27001:
    - "A.9.1.1 - Access Control Policy"
    - "A.9.4.1 - Information Access Restriction"
    - "A.9.4.2 - Secure Log-on Procedures"
    - "A.14.2.5 - Secure System Engineering Principles"
  soc_2:
    - "CC6.1 - Logical Access Controls"
    - "CC6.2 - User Access Authorization"
    - "CC6.3 - Access Revocation"
    - "CC7.2 - Security Monitoring & Telemetry"
  owasp_asvs_v4:
    - "V1.4.1 - Architecture and Design Verification"
    - "V4.1.1 - Access Control Architecture"
    - "V4.2.1 - Operation Level Access Control"
    - "V4.3.1 - Other Access Control Considerations"
  nist_sp_800_161:
    - "AC-3 - Access Enforcement"
    - "AC-4 - Information Flow Enforcement"
    - "SC-8 - Transmission Confidentiality and Integrity"
    - "SI-7 - Software, Firmware, and Information Integrity"

constitutional_mandate: >
  No commercial capability, paid feature, licensed function, privileged operation,
  API capability, package entitlement, or restricted platform service may rely on
  client-side enforcement as its authoritative security control.
  Client-side gating is strictly presentation-only (UX optimization).
  Authoritative entitlement, authorization, scope, validity, and revocation MUST be
  enforced server-side by trusted federated authorities under a zero-trust, fail-closed model.

canonical_rules:
  - rule_id: "RULE-CAP-001-01"
    name: "SERVER_AUTHORITATIVE_ENFORCEMENT"
    severity: "CRITICAL"
    enforcement: "MANDATORY_FAIL_CLOSED"
    description: >
      All commercial tier capabilities, licensed services, privileged endpoints, and restricted
      operations must be authoritatively evaluated and enforced on the server or gateway layer.
      Client applications are forbidden from acting as an entitlement decision point.

  - rule_id: "RULE-CAP-001-02"
    name: "UNTRUSTED_CLIENT_STATE_PROHIBITION"
    severity: "CRITICAL"
    enforcement: "MANDATORY_FAIL_CLOSED"
    description: >
      Client-side state, including localStorage, sessionStorage, cookies without server-side
      signature, URL parameters, client SDK memory flags, and DOM states, is untrusted.
      Any evaluation attempting to grant privileged capability based on unverified client claims
      must be rejected immediately with [UNTRUSTED_CLIENT_CLAIMS_REJECTED].

  - rule_id: "RULE-CAP-001-03"
    name: "CRYPTOGRAPHIC_CAPABILITY_GRANTS"
    severity: "CRITICAL"
    enforcement: "MANDATORY_FAIL_CLOSED"
    description: >
      Authoritative access to protected capabilities requires a verified cryptographic capability
      grant signed by a trusted Federated Entitlement Authority using approved cryptography
      (Ed25519 or HMAC-SHA256).

  - rule_id: "RULE-CAP-001-04"
    name: "STRICT_BOUNDED_CONTEXT_AND_TENANT_ISOLATION"
    severity: "HIGH"
    enforcement: "MANDATORY_FAIL_CLOSED"
    description: >
      Every capability grant must be strictly bound to an explicit Subject (principal ID) and
      Tenant ID. Using a grant issued for Tenant A on Tenant B resources must be rejected with
      [CAPABILITY_SCOPE_MISMATCH].

  - rule_id: "RULE-CAP-001-05"
    name: "TEMPORAL_VALIDITY_BOUNDS"
    severity: "HIGH"
    enforcement: "MANDATORY_FAIL_CLOSED"
    description: >
      Capability grants must contain explicit temporal validity parameters (issuedAt, notBefore,
      expiresAt). Grants presented after expiration or before activation must be rejected with
      [CAPABILITY_EXPIRED] or [CAPABILITY_NOT_YET_VALID].

  - rule_id: "RULE-CAP-001-06"
    name: "REAL_TIME_REVOCATION_REGISTRY_CHECK"
    severity: "CRITICAL"
    enforcement: "MANDATORY_FAIL_CLOSED"
    description: >
      Every server-authoritative evaluation must query the authoritative Capability Revocation
      Registry prior to granting execution. Revoked grants must immediately return [CAPABILITY_REVOKED].

  - rule_id: "RULE-CAP-001-07"
    name: "IMMUTABILITY_AND_ANTI_TAMPER_PROTECTION"
    severity: "CRITICAL"
    enforcement: "MANDATORY_FAIL_CLOSED"
    description: >
      Capability grant artifacts are strictly immutable. Any mutation of payload attributes
      (subject, tenant, capability, scope, timestamps) invalidates the cryptographic signature
      and triggers [CAPABILITY_TAMPER_DETECTED] with security alert emission.

  - rule_id: "RULE-CAP-001-08"
    name: "FAIL_CLOSED_DEFAULT_DENY"
    severity: "CRITICAL"
    enforcement: "MANDATORY_FAIL_CLOSED"
    description: >
      In the absence of a valid, active, verified, unrevoked grant matching the requested tenant,
      principal, capability, and scope, the evaluation must default to DENY (allowed: false).

  - rule_id: "RULE-CAP-001-09"
    name: "FEDERATED_AUTHORITY_TRUST_STORE"
    severity: "HIGH"
    enforcement: "MANDATORY_FAIL_CLOSED"
    description: >
      Capability grants must originate from an authority registered in the trusted federation
      keystore. Grants signed by untrusted or unknown issuers must be rejected with
      [CAPABILITY_AUTHORITY_UNTRUSTED].

  - rule_id: "RULE-CAP-001-10"
    name: "REPLAY_PREVENTION_AND_NONCE_GOVERNANCE"
    severity: "HIGH"
    enforcement: "MANDATORY_FAIL_CLOSED"
    description: >
      Every capability grant must incorporate a unique grantId and cryptographic nonce to ensure
      traceability, non-repudiation, and replay resistance across distributed nodes.

  - rule_id: "RULE-CAP-001-11"
    name: "COMPREHENSIVE_AUDITABLE_TELEMETRY"
    severity: "MEDIUM"
    enforcement: "MANDATORY"
    description: >
      Every capability evaluation decision (allowed, denied, revoked, tampered) must produce
      structured, immutable audit logs containing timestamp, principal, tenant, capability,
      grantId, decision code, and client context.

  - rule_id: "RULE-CAP-001-12"
    name: "DOWNSTREAM_PROPAGATION_INTEGRITY"
    severity: "HIGH"
    enforcement: "MANDATORY_FAIL_CLOSED"
    description: >
      Federated service calls across microservice boundaries must propagate cryptographic
      capability grants. Downstream services must re-evaluate grants authoritatively at each
      service boundary rather than trusting upstream upstream transit headers blindly.

architecture_topology:
  client_tier:
    classification: "UNTRUSTED_SURFACE"
    responsibilities:
      - "User interface rendering"
      - "Optimistic UX workflows"
      - "Presentation gating based on cached hints"
    prohibitions:
      - "Must NOT perform authoritative access decisions"
      - "Must NOT bypass server-side verification"
  server_boundary:
    classification: "TRUSTED_ENFORCEMENT_POINT"
    responsibilities:
      - "Request context extraction"
      - "Cryptographic grant verification"
      - "Revocation status verification"
      - "Tenant boundary isolation"
      - "Audit logging"
  federated_authority:
    classification: "AUTHORITATIVE_ISSUANCE_POINT"
    responsibilities:
      - "Identity & tier entitlement resolution"
      - "Cryptographic grant issuance"
      - "Key management (Ed25519 / HMAC-SHA256)"
      - "Revocation broadcasting"

architecture_invariants:
  - rule: "Plugin Independency"
    description: "Capabilities MUST NEVER be hardcoded into engine-core. They must be registered via the CapabilityRegistry as independent plugins/microservices."
  - rule: "Universal Platform Abstraction"
    description: "Capabilities MUST NEVER rely on specific OS commands (e.g. bash, systemd) directly in the orchestrator. All execution must pass through Universal Resource Contract and Provider Adapter."
  - rule: "Agentless Capability Parity Invariant"
    description: "Every commercially released executable capability MUST be invocable by a human operator through the canonical CLI and/or supported UI without requiring an AI model, autonomous agent, LLM, or agentic planner. Agentic interfaces may improve automation, but MUST NOT be the sole access path."
  - rule: "Execution Path Equivalence Invariant"
    description: "Manual CLI/UI execution and agent-initiated execution MUST converge on the same Intent, Plan, Policy Decision, Authorization, Execution, Verification, Evidence, and Passport pipeline. No surface may bypass the universal execution governance path."


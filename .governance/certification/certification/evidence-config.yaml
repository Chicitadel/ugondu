schema: "2026.1"
generatorVersion: "Evidence Engine 2.0"
platformVersion: "1.8.0"

evidence:
  git:
    - name: commit
      command: git log -n 1
    - name: status
      command: git status --porcelain
  security:
    - name: composer_audit
      command: composer audit
    - name: npm_audit
      command: npm audit --audit-level=high
  api:
    - name: health
      endpoint: /v1/health
    - name: discovery
      endpoint: /v1/discovery
  coverage:
    - name: phpunit
      command: phpunit --coverage-clover
  sbom:
    - name: package_lock
      command: Get-FileHash -Algorithm SHA256 package-lock.json
  registry:
    - name: services
      command: cat .governance/protocols/services.json

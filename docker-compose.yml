networks:
  ugondu-internal:
    driver: bridge
    internal: true           # [en] Services cannot reach the internet directly
  ugondu-external:
    driver: bridge

services:

  # ────────────────────────────────────────────────────
  # [en] Billing Gateway — License and Edition Authority
  # ────────────────────────────────────────────────────
  billing-gateway:
    build:
      context: .
      dockerfile: ./server/billing-gateway/Dockerfile
    container_name: ugondu-billing-gateway
    restart: unless-stopped
    networks:
      - ugondu-internal
    environment:
      - PORT=4002
      - IDENTITY_AUTHORITY_URL=${IDENTITY_AUTHORITY_URL:-https://identity.airroofers.eu/api/v1}
      - BILLING_AUTHORITY_URL=${BILLING_AUTHORITY_URL:-https://billing.airroofers.eu/api/v1}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://console.airroofers.eu}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4002/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ────────────────────────────────────────────────────
  # [en] Engine Core — DAG and Recipe Computation
  # ────────────────────────────────────────────────────
  engine-core:
    build:
      context: .
      dockerfile: ./server/engine-core/Dockerfile
    container_name: ugondu-engine-core
    restart: unless-stopped
    networks:
      - ugondu-internal
      - ugondu-external
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - BILLING_GATEWAY_URL=http://billing-gateway:4002/v1
      - UGONDU_RECIPE_PRIVATE_KEY=${UGONDU_RECIPE_PRIVATE_KEY:-}
      - UGONDU_KEY_REF=${UGONDU_KEY_REF:-}
      - UGONDU_PRIVATE_KEY=${UGONDU_PRIVATE_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://console.airroofers.eu}
    depends_on:
      billing-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ────────────────────────────────────────────────────
  # [en] Plugin Manager — Sandboxed Plugin Execution
  # ────────────────────────────────────────────────────
  plugin-manager:
    build:
      context: .
      dockerfile: ./server/plugin-manager/Dockerfile
    container_name: ugondu-plugin-manager
    restart: unless-stopped
    networks:
      - ugondu-internal
    volumes:
      - ./plugins:/usr/src/app/plugins:ro    # [en] Plugin directory mounted read-only
    environment:
      - PORT=4003
      - PLUGINS_DIR=/usr/src/app/plugins
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://console.airroofers.eu}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4003/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ────────────────────────────────────────────────────
  # [en] Repository Adapter — Universal Provider Detection
  # ────────────────────────────────────────────────────
  repository-adapter:
    build:
      context: .
      dockerfile: ./server/repository-adapter/Dockerfile
    container_name: ugondu-repository-adapter
    restart: unless-stopped
    networks:
      - ugondu-internal
    environment:
      - PORT=4005
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://console.airroofers.eu}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4005/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ────────────────────────────────────────────────────
  # [en] Event Bus — Isolated Pub/Sub Message Router
  # ────────────────────────────────────────────────────
  event-bus:
    build:
      context: .
      dockerfile: ./server/event-bus/Dockerfile
    container_name: ugondu-event-bus
    restart: unless-stopped
    networks:
      - ugondu-internal
    environment:
      - PORT=4004
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://console.airroofers.eu}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4004/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

name: Negative Auth Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Base OIDC Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_OIDC_BASE }}
          aws-region: eu-west-3

      - name: Assume Tagged Execution Session
        shell: bash
        env:
          EXECUTION_ROLE_ARN: ${{ secrets.AWS_ROLE_TO_ASSUME_EXECUTION }}
          TX_ID: ${{ github.run_id }}
        run: |
          CREDS=$(aws sts assume-role \
            --role-arn "$EXECUTION_ROLE_ARN" \
            --role-session-name "$TX_ID" \
            --tags "Key=UgonduTransactionId,Value=$TX_ID" \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
            --output text)
          read -r AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN <<< "$CREDS"
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN" >> $GITHUB_ENV

      - name: Verify Caller Identity
        run: aws sts get-caller-identity

      - name: Negative Test 1 - Create without UgonduCOR tag (Should FAIL with UnauthorizedOperation)
        run: |
          OUTPUT=$(aws ec2 create-vpc --cidr-block 10.0.0.0/16 --region eu-west-3 2>&1 || true)
          echo "API Response: $OUTPUT"
          if echo "$OUTPUT" | grep -q "UnauthorizedOperation"; then
            echo "Passed: Create VPC without UgonduCOR tag was denied as expected."
          else
            echo "Failed: Did not receive UnauthorizedOperation. Inconclusive."
            exit 1
          fi

      - name: Negative Test 2 - Create with wrong TransactionId (Should FAIL with UnauthorizedOperation)
        run: |
          OUTPUT=$(aws ec2 create-vpc --cidr-block 10.0.0.0/16 --region eu-west-3 --tag-specifications 'ResourceType=vpc,Tags=[{Key=UgonduCOR,Value=true},{Key=UgonduTransactionId,Value=invalid-tx-id}]' 2>&1 || true)
          echo "API Response: $OUTPUT"
          if echo "$OUTPUT" | grep -q "UnauthorizedOperation"; then
            echo "Passed: Create VPC with wrong TransactionId was denied as expected."
          else
            echo "Failed: Did not receive UnauthorizedOperation. Inconclusive."
            exit 1
          fi

      - name: Positive Test - Create with correct tags (Should SUCCEED)
        id: create_vpc
        run: |
          VPC_ID=$(aws ec2 create-vpc --cidr-block 10.0.0.0/16 --region eu-west-3 --tag-specifications "ResourceType=vpc,Tags=[{Key=UgonduCOR,Value=true},{Key=UgonduTransactionId,Value=${{ github.run_id }}},{Key=Name,Value=UgonduAuthTestVpc}]" --query 'Vpc.VpcId' --output text)
          echo "VPC_ID=$VPC_ID" >> $GITHUB_ENV
          echo "Successfully created VPC $VPC_ID"

      - name: Negative Test 3 - Delete mismatched resource (Should FAIL with UnauthorizedOperation)
        if: success() || failure()
        run: |
          # Try to delete the default VPC which doesn't have the UgonduCOR tag
          # Find a VPC that is not ours to attempt deletion
          EXTERNAL_VPC=$(aws ec2 describe-vpcs --region eu-west-3 --query 'Vpcs[0].VpcId' --output text 2>/dev/null || echo "")
          if [ -n "$EXTERNAL_VPC" ] && [ "$EXTERNAL_VPC" != "None" ]; then
            OUTPUT=$(aws ec2 delete-vpc --vpc-id $EXTERNAL_VPC --region eu-west-3 2>&1 || true)
            echo "API Response: $OUTPUT"
            if echo "$OUTPUT" | grep -q "UnauthorizedOperation"; then
              echo "Passed: Deleting a mismatched resource was denied."
            else
              echo "Failed: Did not receive UnauthorizedOperation. Inconclusive."
              exit 1
            fi
          else
            echo "Passed: No external VPC to test, assuming mismatch logic is covered."
          fi

      - name: Positive Test - Delete with correct tags (Should SUCCEED)
        if: always()
        run: |
          if [ -n "$VPC_ID" ]; then
            aws ec2 delete-vpc --vpc-id $VPC_ID --region eu-west-3
            echo "Successfully deleted VPC $VPC_ID"
          else
            echo "No VPC was created, nothing to delete."
          fi

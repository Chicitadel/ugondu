name: GCP One-Step Bootstrap Safety

on:
  pull_request:
    branches: [main, phase4/production-hardening, 'phase4/**']
    paths:
      - 'scripts/bootstrap/gcp-one-step-bootstrap.mjs'
      - 'tests/gcp-one-step-bootstrap.test.mjs'
      - '.governance/platform/bootstrap/gcp-bootstrap-profile.json'
      - '.github/workflows/gcp-bootstrap-safety.yml'
  push:
    branches: ['feat/gcp-one-step-bootstrap-2026-10-27']
    paths:
      - 'scripts/bootstrap/gcp-one-step-bootstrap.mjs'
      - 'tests/gcp-one-step-bootstrap.test.mjs'
      - '.governance/platform/bootstrap/gcp-bootstrap-profile.json'
      - '.github/workflows/gcp-bootstrap-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gcp-bootstrap-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'
      - name: Assert exact SHA and clean checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
      - name: GCP bootstrap regression tests
        run: node --test tests/gcp-one-step-bootstrap.test.mjs
      - name: Bootstrap bundle integrity
        run: node scripts/bootstrap/validate-bundle.mjs

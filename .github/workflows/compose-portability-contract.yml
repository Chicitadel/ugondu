name: Ugondu Compose Portability Contract

on:
  push:
    branches:
      - security/arf-cloud-portable-compose-hardening-2026-10-30
    paths:
      - "docker-compose.yml"
      - "tests/deployment/compose-network-contract.test.mjs"
      - ".github/workflows/compose-portability-contract.yml"
  pull_request:
    branches:
      - fix/cor-runtime-verifier-depth-2026-10-30
    paths:
      - "docker-compose.yml"
      - "tests/deployment/compose-network-contract.test.mjs"
      - ".github/workflows/compose-portability-contract.yml"

permissions:
  contents: read

jobs:
  compose-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose --file docker-compose.yml config --quiet
      - name: Run network and ingress policy tests
        run: node --test tests/deployment/compose-network-contract.test.mjs
